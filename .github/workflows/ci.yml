name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Current supervision, torch, transformers and scikit-learn need Python >= 3.10/3.11.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # torch is a dependency; --torch-backend cpu avoids the much larger default (CUDA) wheel.
      - name: Install package with test group
        run: |
          uv venv
          uv pip install --torch-backend cpu -e . --group test

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Minimize uv cache
        run: uv cache prune --ci
